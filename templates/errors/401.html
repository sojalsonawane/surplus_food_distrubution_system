{% extends "base.html" %}
{% block title %}401 - Unauthorized | Surplus Food Distribution System{% endblock %}
{% block content %}
<div class="container py-5 text-center my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm p-5 rounded-4 bg-white">
                <i class="fa-solid fa-lock text-warning display-1 mb-3"></i>
                <h1 class="fw-bold text-dark display-5">401</h1>
                <h4 class="fw-semibold mb-3">Authentication Required</h4>
                <p class="text-muted mb-4">
                    You must be logged in with appropriate system credentials to view or interact with this page.
                </p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="/login" class="btn btn-success px-4 py-2">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
                    </a>
                    <a href="{{ url_for('main.index') }}" class="btn btn-outline-secondary px-4 py-2">
                        <i class="fa-solid fa-house me-2"></i> Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
