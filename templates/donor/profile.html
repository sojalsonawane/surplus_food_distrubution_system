{% extends "base.html" %}

{% block title %}Donor Profile - Surplus Food Distribution System{% endblock %}

{% block content %}
<div class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="text-success fw-bold text-uppercase small">Food Donor Portal</span><h2 class="fw-bold mb-0">Manage Donor Profile</h2></div><a href="{{ url_for('donor.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a></div>
<form method="post" class="custom-card p-4"><div class="row g-3"><div class="col-md-6"><label class="form-label fw-semibold">Contact Name</label><input name="name" class="form-control" value="{{ form.get('name', donor.name) }}" required></div><div class="col-md-6"><label class="form-label fw-semibold">Phone</label><input name="phone" class="form-control" value="{{ form.get('phone', donor.phone) }}" required></div><div class="col-md-6"><label class="form-label fw-semibold">Donor Type</label><select name="donor_type" class="form-select"><option value="individual">Individual</option><option value="restaurant">Restaurant</option><option value="caterer">Caterer</option><option value="organization">Organization</option></select></div><div class="col-md-6"><label class="form-label fw-semibold">Organization Name</label><input name="organization_name" class="form-control" value="{{ form.get('organization_name', donor.organization_name or '') }}"></div><div class="col-12"><label class="form-label fw-semibold">Address</label><textarea name="address" class="form-control" required>{{ form.get('address', donor.address) }}</textarea></div><div class="col-md-4"><label class="form-label fw-semibold">City</label><input name="city" class="form-control" value="{{ form.get('city', donor.city) }}" required></div><div class="col-md-4"><label class="form-label fw-semibold">Area</label><input name="area" class="form-control" value="{{ form.get('area', donor.area) }}" required></div><div class="col-md-4"><label class="form-label fw-semibold">Pincode</label><input name="pincode" class="form-control" value="{{ form.get('pincode', donor.pincode) }}" required></div><div class="col-12"><button class="btn btn-success px-4 fw-bold" type="submit">Save Profile</button></div></div></form></div>
{% endblock %}
