{% extends "base.html" %}

{% block title %}Post Surplus Food - Surplus Food Distribution System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div><span class="text-success fw-bold text-uppercase small">Food Donor Portal</span><h2 class="fw-bold mb-0">Post Surplus Food</h2></div>
        <a href="{{ url_for('donor.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
    </div>
    <form method="post" enctype="multipart/form-data" class="custom-card p-4">
        <div class="row g-3">
            <div class="col-md-6"><label class="form-label fw-semibold">Food Name</label><input name="food_name" class="form-control" value="{{ form.get('food_name', '') }}" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold" for="food-category">Food Category</label><select id="food-category" name="food_category" class="form-select" required><option value="" disabled {% if not form.get('food_category') %}selected{% endif %}>Select food category</option><option value="cooked_meals" {% if form.get('food_category') == 'cooked_meals' %}selected{% endif %}>Cooked Meals</option><option value="raw_ingredients" {% if form.get('food_category') == 'raw_ingredients' %}selected{% endif %}>Raw Ingredients</option><option value="bakery_items" {% if form.get('food_category') == 'bakery_items' %}selected{% endif %}>Bakery Items</option><option value="packaged_foods" {% if form.get('food_category') == 'packaged_foods' %}selected{% endif %}>Packaged Foods</option><option value="fruits_vegetables" {% if form.get('food_category') == 'fruits_vegetables' %}selected{% endif %}>Fruits &amp; Vegetables</option><option value="dairy_products" {% if form.get('food_category') == 'dairy_products' %}selected{% endif %}>Dairy Products</option><option value="beverages" {% if form.get('food_category') == 'beverages' %}selected{% endif %}>Beverages</option><option value="other" {% if form.get('food_category') == 'other' %}selected{% endif %}>Other</option></select></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Quantity</label><input name="quantity" type="number" min="0.1" step="0.1" class="form-control" value="{{ form.get('quantity', '') }}" required></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Unit</label><select name="unit" class="form-select"><option value="kg">Kg</option><option value="litres">Litres</option><option value="packets">Packets</option><option value="plates">Plates</option></select></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Estimated Servings</label><input name="servings_estimate" type="number" min="1" class="form-control" value="{{ form.get('servings_estimate', '') }}" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Food Type</label><select name="food_type" class="form-select"><option value="veg">Vegetarian</option><option value="non_veg">Non-vegetarian</option></select></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Food Image</label><input name="food_image" type="file" accept="image/*" class="form-control"></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Preparation Date and Time</label><input name="preparation_datetime" type="datetime-local" class="form-control" value="{{ form.get('preparation_datetime', '') }}" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Best Before Date and Time</label><input name="best_before_datetime" type="datetime-local" class="form-control" value="{{ form.get('best_before_datetime', '') }}" required></div>
            <div class="col-12"><label class="form-label fw-semibold">Pickup Address</label><textarea name="pickup_address" class="form-control" required>{{ form.get('pickup_address', '') }}</textarea></div>
            <div class="col-md-4"><label class="form-label fw-semibold">City</label><input name="city" class="form-control" value="{{ form.get('city', '') }}" required></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Area</label><input name="area" class="form-control" value="{{ form.get('area', '') }}" required></div>
            <div class="col-md-4"><label class="form-label fw-semibold">Pincode</label><input name="pincode" class="form-control" value="{{ form.get('pincode', '') }}" required></div>
            <div class="col-md-6"><label class="form-label fw-semibold">Contact Number</label><input name="contact_number" class="form-control" value="{{ form.get('contact_number', '') }}" required></div>
            <div class="col-12"><label class="form-label fw-semibold">Special Instructions</label><textarea name="special_instructions" class="form-control">{{ form.get('special_instructions', '') }}</textarea></div>
            <div class="col-12"><button class="btn btn-success px-4 fw-bold" type="submit"><i class="fa-solid fa-paper-plane me-2"></i>Post Donation</button></div>
        </div>
    </form>
</div>
{% endblock %}
